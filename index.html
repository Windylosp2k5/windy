<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>windy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Be+Vietnam+Pro:wght@600&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff6e1;--rose:#be235f;--plum:#46103a;--line:#ffbedc;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#fff6e1;--rose:#be235f;--plum:#46103a;--line:#ffbedc}}
:root[data-theme="dark"]{--cream:#fff6e1;--rose:#be235f;--plum:#46103a;--line:#ffbedc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--plum);overflow:hidden;font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
header{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:clamp(14px,3.2vh,30px) 16px 0;text-align:center;pointer-events:none}
h1{margin:0;font:700 clamp(1.7rem,5.4vw,2.7rem)/1.15 "Playfair Display",Georgia,serif;color:var(--cream);
  text-shadow:0 2px 3px rgba(90,20,70,.7),0 0 22px rgba(255,120,180,.55)}
header p{margin:.35em 0 0;font:italic 500 clamp(.9rem,2.5vw,1.15rem)/1.3 "Playfair Display",Georgia,serif;color:#fff;
  text-shadow:0 1px 2px rgba(90,20,70,.8)}
#msg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + clamp(100px,17vh,140px));width:min(620px,90vw);box-sizing:border-box;
  padding:clamp(16px,3vw,26px);border-radius:22px;border:2px solid var(--line);text-align:center;
  background:linear-gradient(180deg,rgba(120,30,90,.88),rgba(70,15,70,.88));
  font-size:clamp(.95rem,2.6vw,1.2rem);line-height:1.65;
  opacity:0;transform:translate(-50%,-18px);pointer-events:none;transition:opacity .5s ease,transform .5s ease}
#msg.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#msg span{display:block}
#btn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);
  min-width:210px;padding:14px 26px;border:0;border-radius:999px;background:var(--rose);color:#fff;
  font:600 1rem "Be Vietnam Pro","Segoe UI",sans-serif;cursor:pointer;box-shadow:0 6px 22px rgba(190,35,95,.55)}
#btn:hover{background:#d22a6c}
#btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<header><h1>Happy Women’s Day 20/10</h1><p>May your life bloom like a beautiful garden</p></header>

  <span>Mong mọi điều tốt đẹp sẽ đến với bạn!</span>
</div>

    ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.ellipse(-p.sz*.05,-p.sz*.08,p.sz*.25,p.sz*.12,0,0,6.283);ctx.fill();
    ctx.restore();
  });
  var span=H+80;ctx.textBaseline="top";
  for(i=0;i<9;i++){
    var u=((ht*(.8+(i%3)*.25)+i*90)%span)/span,hy=H+30-u*span,al2=.75*Math.sin(u*Math.PI);if(al2<.02)continue;
    var hx=((i*131+80)%Math.max(100,W-100))+40+Math.sin(ht*.03+i)*18;
    ctx.fillStyle="rgba(255,130,180,"+al2+")";ctx.font=(14+(i%3)*5)+"px 'Segoe UI Symbol',sans-serif";ctx.fillText("♥",hx,hy);
  }
}
var last=0;
function loop(ts){var dt=Math.min((ts-last)/1000||.016,.1);last=ts;frame(dt);requestAnimationFrame(loop)}
function start(){resize();if(still){frame(0)}else{requestAnimationFrame(loop)}}
addEventListener("resize",function(){resize();if(still)frame(0)});
if(img.complete)start();else{img.onload=start;img.onerror=start}
var btn=document.getElementById("btn"),msg=document.getElementById("msg");
btn.addEventListener("click",function(){
  var on=msg.classList.toggle("on");btn.setAttribute("aria-expanded",on);
  btn.textContent=on?"🌹 Đóng lời chúc":"💝 Mở lời chúc";
});
})();
</script>
